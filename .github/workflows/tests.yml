name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with its test dependencies
        run: python -m pip install -e ".[test]"
      # test_core_analytics.py signs in to Adobe Analytics, so it needs real
      # credentials. Every other test runs offline.
      - name: Run the offline tests
        run: python -m pytest -q test --ignore=test/test_core_analytics.py
